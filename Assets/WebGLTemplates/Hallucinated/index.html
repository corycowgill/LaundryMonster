<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0b0b0f; color: #e8e8ee;
      font-family: "Rajdhani", "Trebuchet MS", system-ui, sans-serif;
      overflow: hidden;
      /* A game played with the thumbs must not also scroll, zoom or select the page,
         and iOS will happily do all three on top of the canvas otherwise. */
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    #wrap {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    /* The canvas is hidden until BOTH the ident and the download are done, so the
       player never sees a half-loaded frame or a flash of black. */
    /* Fill the viewport rather than sitting at a fixed design size. On a phone the old
       fixed width letterboxed the game down to a stamp in the middle of the screen. */
    #unity-canvas {
      display: block;
      width: 100%; height: 100%;
      background: {{{ BACKGROUND_COLOR }}};
      opacity: 0; transition: opacity .35s ease;
      touch-action: none;
    }
    #unity-canvas.ready { opacity: 1; }

    #boot {
      position: fixed; left: 50%; bottom: 14%;
      transform: translateX(-50%);
      width: min(420px, 72vw); text-align: center;
      opacity: 0; transition: opacity .25s ease; pointer-events: none;
    }
    #boot.show { opacity: 1; }
    #boot-msg { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
    #boot-bar {
      margin-top: 10px; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,.14); overflow: hidden;
    }
    #boot-fill { height: 100%; width: 0%; background: #00ffaa; transition: width .15s ease; }
    #boot-err { margin-top: 10px; font-size: 13px; color: #ff6b6b; }

    #hint {
      position: fixed; left: 50%; bottom: 3%; transform: translateX(-50%);
      font-size: 13px; letter-spacing: .08em; opacity: 0;
      transition: opacity .4s ease; pointer-events: none;
    }
    #hint.show { opacity: .5; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
  </div>

  <div id="boot">
    <div id="boot-msg">Loading</div>
    <div id="boot-bar"><div id="boot-fill"></div></div>
    <div id="boot-err"></div>
  </div>

  <div id="hint">click the game to give it keyboard focus</div>

  <!--
    Studio ident. Classic script, loaded before anything else so the overlay can
    attach on the first paint; it defines window.HallucinatedIntro. Same file the
    other Hallucinated Games titles play.
  -->
  <script src="TemplateData/hallucinated-intro.js"></script>

  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
  (function () {
    var params = new URLSearchParams(location.search);

    var canvas = document.querySelector("#unity-canvas");
    var isTouch = ("ontouchstart" in window) || (navigator.maxTouchPoints || 0) > 0;

    // Size the drawing buffer ourselves, with matchWebGLToCanvasSize off below, so Unity
    // and this code are not both resizing it.
    //
    // The cap matters more than the fit. Phones report a devicePixelRatio of 3, and a
    // 3x framebuffer on a phone GPU costs nine times the fill rate of a 1x one for a
    // game that is mostly flat colour - it turned a smooth frame rate into a slideshow.
    function fitCanvas() {
      var dpr = Math.min(window.devicePixelRatio || 1, isTouch ? 1.5 : 2);
      var w = Math.max(1, Math.round(window.innerWidth * dpr));
      var h = Math.max(1, Math.round(window.innerHeight * dpr));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
    }
    fitCanvas();
    window.addEventListener("resize", fitCanvas);
    // iOS reports the old size during the rotation itself, so measure again after it.
    window.addEventListener("orientationchange", function () {
      setTimeout(fitCanvas, 120);
      setTimeout(fitCanvas, 500);
    });

    // Stop the browser treating thumb input as page gestures (pull-to-refresh,
    // double-tap zoom, long-press selection) while the game is being played.
    ["touchstart", "touchmove", "touchend", "gesturestart"].forEach(function (ev) {
      document.addEventListener(ev, function (e) {
        if (e.target === canvas || e.touches) e.preventDefault();
      }, { passive: false });
    });

    var boot = document.querySelector("#boot");
    var bootFill = document.querySelector("#boot-fill");
    var bootMsg = document.querySelector("#boot-msg");
    var bootErr = document.querySelector("#boot-err");
    var hint = document.querySelector("#hint");

    // The ident and the download run CONCURRENTLY. A Unity WebGL build is tens of
    // megabytes, so playing the logo and then starting the download would add its
    // 4.6s to the wait. Started together, the ident covers the load instead of
    // adding to it, and the canvas is revealed when both finish.
    var introDone = (function () {
      try {
        if (params.has("nointro") || params.has("debug") || !window.HallucinatedIntro) {
          return Promise.resolve({ skipped: true });
        }
        return window.HallucinatedIntro.play({
          skippable: true,
          // A WebAudio sting needs a prior user gesture; a cold page load has none,
          // so it would be dropped silently.
          sound: false,
        }).catch(function () { return { skipped: true }; });
      } catch (e) {
        return Promise.resolve({ skipped: true });
      }
    })();

    var unityReady = createUnityInstance(canvas, {
      arguments: [],
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      // fitCanvas() above owns the drawing buffer size.
      matchWebGLToCanvasSize: false,
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    }, function (progress) {
      bootFill.style.width = (progress * 100).toFixed(1) + "%";
    });

    // If the ident finishes first, show the modest progress bar for the rest.
    introDone.then(function () {
      var settled = false;
      unityReady.then(function () { settled = true; }, function () { settled = true; });
      Promise.resolve().then(function () {
        if (!settled) boot.classList.add("show");
      });
    });

    Promise.all([introDone, unityReady]).then(function (results) {
      boot.classList.remove("show");
      canvas.classList.add("ready");
      canvas.focus();
      fitCanvas();
      // The focus hint is about keyboards. On a touch device it is just noise.
      if (!isTouch) {
        hint.classList.add("show");
        setTimeout(function () { hint.classList.remove("show"); }, 6000);
      }

      window.__unity = results[1];
      window.__gameReady = true;
    }).catch(function (message) {
      boot.classList.add("show");
      bootMsg.textContent = "Failed to load";
      bootErr.textContent = String(message);
      console.error("[LaundryMonster] load failed:", message);
    });

    // Keyboard focus: the game reads WASD, so the canvas must hold focus.
    window.addEventListener("pointerdown", function () {
      try { canvas.focus(); } catch (e) {}
    });
  })();
  </script>
</body>
</html>
